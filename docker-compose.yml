services:
  postgres:
    image: postgres
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobber-auth
    volumes:
      - postgres-data:/var/lib/postgresql
  pulsar:
    image: apachepulsar/pulsar
    ports:
      - 6650:6650
    command: >
      /pulsar/bin/pulsar standalone
volumes:
  postgres-data:
